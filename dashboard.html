<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV 流水线控制台</title>
<style>
  :root{
    --bg:#1a1b2e; --panel:#23243f; --panel2:#2c2d4f;
    --ink:#e8e6f5; --ink2:#9a98c0; --dim:#5d5b80;
    --accent:#f9d285; --accent2:#d97757; --ok:#7bd88f; --warn:#f0b64b; --err:#e06c75;
    --plum:#4d406e; --plum2:#6d598b; --plum3:#775384;
    --border:#3a3b62;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    font-size:14px; line-height:1.6;
    image-rendering:pixelated; padding:18px; min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  .panel{
    background:var(--panel); border:3px solid var(--border);
    box-shadow:0 0 0 2px var(--bg), 0 0 0 5px var(--border);
    padding:16px; margin-bottom:18px; position:relative;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
  h1{font-size:22px;letter-spacing:2px;text-shadow:2px 2px 0 var(--plum);color:var(--accent);}
  h1 .dot{color:var(--ok);animation:blink 1s steps(2) infinite;}
  .conn{font-family:Consolas,monospace;font-size:11px;color:var(--dim);}
  .conn.live{color:var(--ok);}
  .conn.dead{color:var(--err);}
  @keyframes blink{50%{opacity:0;}}
  .clock{font-family:Consolas,monospace;color:var(--dim);font-size:12px;}

  /* 五阶段 */
  .pipeline{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;}
  .stage{flex:1;min-width:140px;background:var(--panel2);border:2px solid var(--border);padding:10px 12px;text-align:center;position:relative;cursor:pointer;transition:transform .1s;}
  .stage:hover{transform:translateY(-2px);}
  .stage .icon{font-size:22px;display:block;margin-bottom:4px;}
  .stage .name{font-size:13px;font-weight:700;letter-spacing:1px;}
  .stage .detail{font-size:11px;color:var(--ink2);margin-top:4px;min-height:30px;}
  .stage.done{border-color:var(--ok);} .stage.done .icon{color:var(--ok);}
  .stage.running{border-color:var(--accent);animation:glow 1.2s steps(2) infinite;} .stage.running .icon{color:var(--accent);}
  .stage.paused{border-color:var(--warn);} .stage.paused .icon{color:var(--warn);}
  .stage.pending{border-color:var(--border);} .stage.pending .icon{color:var(--dim);}
  @keyframes glow{50%{box-shadow:0 0 8px var(--accent);}}
  .bar{height:6px;background:var(--bg);margin-top:8px;border:1px solid var(--border);}
  .bar i{display:block;height:100%;background:var(--accent2);transition:width .4s steps(8);}

  .cols{display:grid;grid-template-columns:1fr 320px;gap:18px;}
  @media(max-width:860px){.cols{grid-template-columns:1fr;}}
  .sec-title{font-size:13px;color:var(--accent);letter-spacing:1px;font-weight:700;margin-bottom:10px;border-left:3px solid var(--accent);padding-left:8px;}

  /* 当前任务 */
  .now-card{display:flex;gap:14px;align-items:flex-start;}
  .now-scene{width:280px;flex-shrink:0;border:3px solid var(--border);background:var(--bg);image-rendering:pixelated;}
  .now-scene img{width:100%;display:block;image-rendering:pixelated;}
  .now-meta{flex:1;}
  .now-meta .row{margin-bottom:8px;}
  .now-meta .k{color:var(--dim);font-size:11px;letter-spacing:1px;}
  .now-meta .v{font-size:14px;}
  .now-meta .v.agent{color:var(--accent);font-weight:700;}

  /* 日志 */
  .log-toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .log-toolbar button{
    background:var(--bg);color:var(--ink2);border:2px solid var(--border);
    padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;
  }
  .log-toolbar button.on{color:var(--ink);border-color:var(--accent);}
  .logbox{background:var(--bg);border:2px solid var(--border);height:280px;overflow-y:auto;padding:8px;font-family:Consolas,monospace;font-size:12px;}
  .logbox .ln{padding:2px 0;border-bottom:1px dashed #1f2038;}
  .logbox .t{color:var(--dim);margin-right:8px;}
  .logbox .lv-info{color:var(--ink2);} .logbox .lv-ok{color:var(--ok);}
  .logbox .lv-warn{color:var(--warn);} .logbox .lv-err{color:var(--err);}

  /* 渲染进度 */
  .render-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px;}
  .render-bar{height:16px;background:var(--bg);border:2px solid var(--border);position:relative;overflow:hidden;}
  .render-bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent2) 0 8px,var(--accent) 8px 16px);transition:width .3s linear;}
  .render-bar .pct-label{position:absolute;right:6px;top:0;font-size:11px;line-height:16px;color:var(--ink);text-shadow:1px 1px 0 var(--bg);}

  /* 模型配置 */
  .model-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .model-row label{width:80px;color:var(--ink2);font-size:12px;flex-shrink:0;}
  select{flex:1;background:var(--bg);color:var(--ink);border:2px solid var(--border);padding:6px 8px;font-family:inherit;font-size:13px;cursor:pointer;}
  select:focus{outline:2px solid var(--accent);}
  .save-btn{background:var(--accent2);color:#fff;border:none;padding:7px 16px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;border:2px solid var(--border);}
  .save-btn:hover{filter:brightness(1.1);} .save-btn:active{transform:translate(1px,1px);}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;}

  /* agents */
  .agents{display:flex;flex-direction:column;gap:8px;}
  .agent-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--border);padding:8px 10px;}
  .agent-dot{width:10px;height:10px;background:var(--dim);flex-shrink:0;}
  .agent-dot.run{background:var(--accent);animation:blink 1s steps(2) infinite;}
  .agent-dot.done{background:var(--ok);}
  .agent-name{font-weight:700;font-size:13px;flex-shrink:0;}
  .agent-role{color:var(--ink2);font-size:11px;}
  .agent-model{margin-left:auto;font-size:11px;color:var(--dim);font-family:Consolas,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>▶ MV 流水线控制台 <span class="dot">●</span></h1>
    <div style="text-align:right;">
      <div class="clock" id="clock">--:--:--</div>
      <div class="conn dead" id="conn">连接中…</div>
    </div>
  </header>

  <div class="panel">
    <div class="pipeline" id="pipeline"></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <div class="sec-title">现在正在干什么</div>
        <div class="now-card">
          <div class="now-scene"><img id="sceneImg" src="" alt="场景帧"></div>
          <div class="now-meta">
            <div class="row"><div class="k">执行 AGENT</div><div class="v agent" id="curAgent">—</div></div>
            <div class="row"><div class="k">角色</div><div class="v" id="curRole">—</div></div>
            <div class="row"><div class="k">当前任务</div><div class="v" id="curTask">—</div></div>
            <div class="row"><div class="k">场景</div><div class="v" id="curScene">—</div></div>
            <div class="row"><div class="k">帧时间</div><div class="v" id="curFrame">—</div></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="sec-title">渲染进度</div>
        <div class="render-meta">
          <span id="rDone">0 / 6240 帧</span>
          <span id="rPct">0%</span>
        </div>
        <div class="render-bar"><i id="rBar" style="width:0%"></i><span class="pct-label" id="rBarLabel"></span></div>
        <div class="hint" id="rHint">等待数据…</div>
      </div>

      <div class="panel">
        <div class="sec-title">实时日志</div>
        <div class="log-toolbar" id="logToolbar">
          <button data-lv="all" class="on">全部</button>
          <button data-lv="info">info</button>
          <button data-lv="ok">ok</button>
          <button data-lv="warn">warn</button>
          <button data-lv="err">err</button>
        </div>
        <div class="logbox" id="logbox"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="sec-title">子 Agent 模型</div>
        <div class="model-row"><label>生产 Agent</label><select id="selProducer"></select></div>
        <div class="model-row"><label>审核 Agent</label><select id="selReviewer"></select></div>
        <button class="save-btn" onclick="saveModel()">保存模型配置</button>
        <div class="hint" id="modelHint">修改后对下一次派单生效</div>
      </div>

      <div class="panel">
        <div class="sec-title">Agent 团队</div>
        <div class="agents" id="agents"></div>
      </div>

      <div class="panel">
        <div class="sec-title">项目速览</div>
        <div class="now-meta">
          <div class="row"><div class="k">项目</div><div class="v" id="projName">—</div></div>
          <div class="row"><div class="k">镜头</div><div class="v" id="projShots">—</div></div>
          <div class="row"><div class="k">规格</div><div class="v" id="projSpec">—</div></div>
          <div class="row"><div class="k">更新</div><div class="v" id="projUpdate">—</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let logLevel = 'all';
let logCache = [];
let lastState = null;

function fmtClock(){ const d=new Date(); $('clock').textContent = d.toLocaleTimeString('zh-CN',{hour12:false}); }
setInterval(fmtClock,1000); fmtClock();

function renderPipeline(stages){
  $('pipeline').innerHTML = stages.map(s=>`
    <div class="stage ${s.status}" title="${s.detail||''}">
      <span class="icon">${s.icon}</span>
      <div class="name">${s.name}</div>
      <div class="detail">${s.detail||''}</div>
      <div class="bar"><i style="width:${s.progress||0}%"></i></div>
    </div>`).join('');
}
function renderCurrent(cur){
  $('curAgent').textContent = cur.agent||'—';
  $('curRole').textContent = cur.role||'—';
  $('curTask').textContent = cur.task||'—';
  $('curScene').textContent = cur.scene||'—';
  $('curFrame').textContent = cur.frameTime!=null ? (cur.frameTime+' s') : '—';
  const img = $('sceneImg');
  if(cur.sceneFrame){ img.src = cur.sceneFrame + '?v=' + Date.now(); img.style.display='block'; }
  else img.style.display='none';
}
function renderRender(r){
  const total = r.totalFrames||6240, done = r.doneFrames||0;
  const pct = total? Math.round(done/total*1000)/10 : 0;
  $('rDone').textContent = `${done} / ${total} 帧`;
  $('rPct').textContent = pct + '%';
  $('rBar').style.width = pct + '%';
  $('rBarLabel').textContent = pct>=1 ? (pct+'%') : '';
  if(done>=total && total>0) $('rHint').textContent = '渲染完成 ✓';
  else if(done>0) $('rHint').textContent = `渲染中… ${done}/${total}（${pct}%）`;
  else $('rHint').textContent = '渲染暂停 · 等待放行指令';
}
function renderLog(){
  const box = $('logbox');
  const filtered = logLevel==='all' ? logCache : logCache.filter(l=>l.level===logLevel);
  box.innerHTML = filtered.map(l=>`<div class="ln"><span class="t">${l.t}</span><span class="lv-${l.level}">[${l.level}] ${l.msg}</span></div>`).join('');
  box.scrollTop = box.scrollHeight;
}
function renderAgents(s){
  const stages = s.pipeline.stages;
  const prodDone = stages[1].status==='done';
  const revRunning = stages[2].status==='running';
  const revDone = stages[2].status==='done';
  const agents = [
    { name:'lead', role:'主AI 总导演', model:s.model.lead||'deepseek-v4-pro', status:'running' },
    { name:'mv-producer', role:'生产 Agent', model:s.model.producer||'deepseek-v4-pro', status: prodDone?'done':'idle' },
    { name:'mv-reviewer', role:'审核 Agent', model:s.model.reviewer||'deepseek-v4-pro', status: revRunning?'running':(revDone?'done':'idle') },
  ];
  $('agents').innerHTML = agents.map(a=>`
    <div class="agent-row">
      <span class="agent-dot ${a.status==='running'?'run':(a.status==='done'?'done':'')}"></span>
      <span class="agent-name">${a.name}</span>
      <span class="agent-role">${a.role}</span>
      <span class="agent-model">${a.model}</span>
    </div>`).join('');
}
function renderMeta(s){
  $('projName').textContent = s.project||'—';
  $('projShots').textContent = '105 镜 / 45→105 切快';
  $('projSpec').textContent = '1920×1080 · 24fps · H.264';
  $('projUpdate').textContent = (s.updatedAt||'').replace('T',' ').slice(0,19);
}
function applyState(s){
  lastState = s;
  renderPipeline(s.pipeline.stages);
  renderCurrent(s.current);
  renderRender(s.render);
  renderAgents(s);
  renderMeta(s);
  logCache = s.log||[];
  renderLog();
}

// ---- SSE 实时连接 ----
function connectSSE(){
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('conn').textContent='实时已连接'; $('conn').className='conn live'; };
  es.onerror = () => { $('conn').textContent='连接断开，重连中…'; $('conn').className='conn dead'; };
  es.addEventListener('state', e => { applyState(JSON.parse(e.data)); });
  es.addEventListener('log', e => {
    const entry = JSON.parse(e.data);
    logCache.push(entry);
    if(logCache.length>300) logCache = logCache.slice(-300);
    renderLog();
  });
  es.addEventListener('render', e => {
    if(lastState){ lastState.render = JSON.parse(e.data); renderRender(lastState.render); }
  });
  es.addEventListener('hello', e => { $('conn').textContent='实时已连接'; $('conn').className='conn live'; });
  // SSE 断线后自动重连由浏览器 EventSource 内置处理
}

// 初始拉取 + 日志过滤器
async function loadConfig(){
  try{
    const r = await fetch('/api/config',{cache:'no-store'});
    const c = await r.json();
    const opts = c.models.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    $('selProducer').innerHTML = opts; $('selReviewer').innerHTML = opts;
    $('selProducer').value = c.defaultModel.producer; $('selReviewer').value = c.defaultModel.reviewer;
  }catch(e){}
}
async function initialFetch(){
  try{
    const r = await fetch('/api/state',{cache:'no-store'});
    applyState(await r.json());
  }catch(e){}
}

$('logToolbar').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  logLevel = btn.dataset.lv;
  document.querySelectorAll('#logToolbar button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderLog();
});

async function saveModel(){
  const def = { producer:$('selProducer').value, reviewer:$('selReviewer').value };
  try{
    const cur = await (await fetch('/api/config')).json();
    const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...cur, defaultModel:def})});
    const j = await r.json();
    $('modelHint').textContent = j.ok ? '已保存 ✓ 下次派单生效' : ('保存失败: '+j.error);
  }catch(e){ $('modelHint').textContent = '保存失败（服务未连接）'; }
}

// 启动
loadConfig();
initialFetch();
connectSSE();
</script>
</body>
</html>
