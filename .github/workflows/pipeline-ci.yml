name: Pipeline CI

# 工具链与控制台的基础检查：语法 + 启动 + 端点冒烟测试

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - 'server.js'
      - 'dashboard.html'
      - 'config.json'
      - 'init.js'
      - 'render.js'
      - 'compose.js'
      - 'verify.js'
      - 'SKILL.md'          # 有 frontmatter 校验，改它必须触发
      - 'state.json.example'
      - '.github/workflows/pipeline-ci.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for f in server.js render.js compose.js verify.js init.js check-skill.js; do
            echo "== $f =="
            node --check $f
          done

      - name: SKILL.md check (same as local check-skill.js)
        run: node check-skill.js SKILL.md

      - name: SKILL.md frontmatter check (inline, independent of local script)
        run: |
          python3 - <<'PY'
          import sys, re
          raw = open('SKILL.md', 'rb').read()
          if raw.startswith(b'\xef\xbb\xbf'):
              sys.exit('SKILL.md 带 UTF-8 BOM（\\ufeff），frontmatter 会失效，请存为无 BOM')
          t = raw.decode('utf-8')
          if not t.startswith('---'):
              sys.exit('SKILL.md 未以 YAML frontmatter (---) 开头')
          end = t.index('\n---', 3)
          fm = t[3:end]
          for k in ('name:', 'description:'):
              if k not in fm:
                  sys.exit(f'frontmatter 缺少必需字段 {k}')
          name = re.search(r'^name:\s*(.+)$', fm, re.M).group(1).strip()
          if not re.fullmatch(r'[a-z0-9-]{1,64}', name):
              sys.exit(f'name 不合规（需小写+连字符，<=64 字符）: {name}')
          desc = re.search(r'^description:\s*(.+)$', fm, re.M).group(1).strip()
          if len(desc) > 1024:
              sys.exit(f'description 过长（{len(desc)} > 1024）')
          try:
              import yaml
              yaml.safe_load(fm)
              print('YAML 解析通过')
          except ModuleNotFoundError:
              print('（未装 PyYAML，跳过深度解析，仅做结构检查）')
          print(f'frontmatter OK: name={name}, description={len(desc)} 字符, 无 BOM')
          PY

      - name: init.js smoke test
        run: |
          node init.js /tmp/ci-proj --name="CI Smoke" --duration=6 --fps=24
          test -f /tmp/ci-proj/brief.md
          test -f /tmp/ci-proj/engine/scene.html
          test -f /tmp/ci-proj/manifest.json
          grep -q 'window.__seek' /tmp/ci-proj/engine/scene.html
          grep -q 'window.__duration' /tmp/ci-proj/engine/scene.html
          echo "init OK"

      - name: verify.js catches bad input
        run: |
          # 故意不给帧/成片，只验页面与时间线（应全过）
          node verify.js --scene=/tmp/ci-proj/engine/scene.html \
                         --expect-duration=6 --fps=24 && echo "verify OK"

      - name: Boot server & smoke test
        run: |
          cp state.json.example state.json
          node server.js &
          SERVER_PID=$!
          sleep 2

          echo "== /api/state =="
          curl -sf http://127.0.0.1:8765/api/state | head -c 200; echo

          echo "== /api/config =="
          curl -sf http://127.0.0.1:8765/api/config | head -c 200; echo

          echo "== /api/stage (POST) =="
          curl -sf -X POST http://127.0.0.1:8765/api/stage \
            -H 'Content-Type: application/json' \
            -d '{"stageId":"review","status":"done","detail":"CI test","progress":100}'; echo

          echo "== /api/render (POST) =="
          curl -sf -X POST http://127.0.0.1:8765/api/render \
            -H 'Content-Type: application/json' \
            -d '{"doneFrames":100}' ; echo

          echo "== dashboard.html =="
          curl -sf http://127.0.0.1:8765/ | grep -q '流水线控制台' && echo "dashboard OK"

          kill $SERVER_PID
          echo "== all smoke tests passed =="
        shell: bash
