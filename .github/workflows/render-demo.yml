name: Render Demo Frame

# 全链路冒烟：init 建骨架 → render 逐帧 → compose 合成 → verify 自检
# 说明：完整 MV 依赖本机 Chrome 与版权音乐，CI 只验证管线可运行性，不跑全片渲染。

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - 'server.js'
      - 'dashboard.html'
      - 'init.js'
      - 'render.js'
      - 'compose.js'
      - 'verify.js'

jobs:
  render-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          npm init -y > /dev/null 2>&1
          npm install puppeteer@latest

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Tool syntax check
        run: |
          for f in render.js compose.js verify.js init.js server.js; do
            echo "== $f =="
            node --check $f
          done

      - name: Init project skeleton
        run: node init.js demo --name="CI Demo" --duration=6 --fps=24

      - name: Render frames
        run: node render.js demo/engine/scene.html --end=6 --fps=24 --out=demo/frames

      - name: Make silent track
        run: |
          ffmpeg -y -v error -f lavfi -i "sine=frequency=440:duration=6" \
                 -c:a libmp3lame -b:a 128k demo/audio/bgm.mp3

      - name: Compose video (with audio)
        run: |
          node compose.js --frames=demo/frames --fps=24 \
                          --audio=demo/audio/bgm.mp3 --out=demo/deliver/video.mp4

      - name: Verify all
        run: |
          node verify.js --scene=demo/engine/scene.html --frames=demo/frames \
                         --video=demo/deliver/video.mp4 \
                         --expect-duration=6 --fps=24 --audio-required=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            demo/deliver/video.mp4
            demo/frames/f_00060.png
