name: Render Demo Frame

# 演示：用 puppeteer 渲染一帧 demo 场景，验证渲染链路可用
# 说明：完整 MV 依赖本机 Chrome 与版权音乐，故 CI 只跑一个自包含的 demo 场景验证管线

on:
  workflow_dispatch:   # 手动触发
  push:
    paths:
      - 'server.js'
      - 'dashboard.html'

jobs:
  render-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          npm init -y > /dev/null 2>&1
          npm install puppeteer@latest

      - name: Render demo frame
        run: |
          cat > demo-scene.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1a1b2e}</style></head>
          <body><script>
          const c=document.createElement('canvas');c.width=640;c.height=360;document.body.appendChild(c);
          const g=c.getContext('2d');
          g.fillStyle='#3D3668';g.fillRect(0,0,640,360);       // 紫罗兰夜空
          g.fillStyle='#775384';g.fillRect(0,240,640,120);      // 城市剪影
          g.fillStyle='#F9D285';g.fillRect(80,260,30,34);       // 亮窗
          g.fillStyle='#D97757';g.fillRect(300,200,54,28);      // Clawd 躯干
          g.fillStyle='#141413';g.fillRect(312,208,10,10);      // 左眼
          g.fillStyle='#141413';g.fillRect(332,208,10,10);      // 右眼
          g.fillStyle='#F9E2A0';g.fillRect(500,40,32,32);       // 弯月
          </script></body></html>
          EOF
          node -e "
            const puppeteer = require('puppeteer');
            (async()=>{
              const b = await puppeteer.launch({headless:'new',args:['--no-sandbox']});
              const p = await b.newPage();
              await p.setViewport({width:640,height:360});
              await p.goto('file://'+process.cwd()+'/demo-scene.html',{waitUntil:'networkidle0'});
              await p.screenshot({path:'demo-frame.png'});
              await b.close();
              console.log('demo frame rendered: demo-frame.png');
            })();
          "
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-frame
          path: demo-frame.png
